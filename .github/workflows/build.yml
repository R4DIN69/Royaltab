name: Build RoyalTab Plugin JAR

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Paper 1.21 JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build JAR with Maven
        run: mvn clean package --batch-mode

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RoyalTab-1.21-JAR
          path: target/RoyalTab-*.jar
          retention-days: 30
