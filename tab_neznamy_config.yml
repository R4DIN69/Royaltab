tablist-formatting:
  enabled: true
  anti-override: true
  sorting-types:
    - "GROUPS:founder,admin,mod,vip,_DEFAULT_"
    - "PLACEHOLDER_A_TO_Z:%player%"

# Rank formatting matching the screenshot ([FOUNDER] red box badge, red name, ping icon)
groups:
  founder:
    tabprefix: "&4&l[&c&lFOUNDER&4&l] &c"
    tabsuffix: " &a📶"
  admin:
    tabprefix: "&6&l[&e&lADMIN&6&l] &6"
    tabsuffix: " &a📶"
  mod:
    tabprefix: "&2&l[&a&lMOD&2&l] &a"
    tabsuffix: " &a📶"
  vip:
    tabprefix: "&6&l[&e&lVIP&6&l] &e"
    tabsuffix: " &a📶"
  _DEFAULT_:
    tabprefix: "&8[&7MEMBER&8] &7"
    tabsuffix: " &a📶"

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "HH:mm:ss"
